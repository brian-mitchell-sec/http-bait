# Local-only stack: the app by itself, bound to loopback, no Caddy.
#
# The README quickstart used to say `docker compose up -d --build` followed by
# `curl http://localhost:8100/.env`, which could not work: the main stack uses
# `expose` rather than `ports`, so 8100 was never published to the host, and
# bringing up Caddy on a laptop binds 80/443 and starts an ACME attempt for the
# placeholder hostname in Caddyfile. Neither is what someone kicking the tyres
# wants. This file is that path.
#
# Do NOT deploy this one. There is no TLS, no reverse proxy, and therefore no
# JA4/JA4H fingerprinting and no X-Forwarded-For. Every record it writes carries
# the Docker bridge gateway address (typically 172.x.x.x) as the client, which
# looks like a real address and means nothing. It exists to let you run the
# routes and the analyzer on a machine you already trust.
services:
  app:
    build: .
    environment:
      - HB_LOG_DIR=/data/logs
      - HB_CANARY_BASE=http://localhost:8100
      - HB_WINDOW_LABEL=local
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8100:8100"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
